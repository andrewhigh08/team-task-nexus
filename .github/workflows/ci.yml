name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0
  GOSEC_VERSION: v2.29.0
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- test/mocks || (echo "::error::generated files are stale, run 'make generate'" && exit 1)

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

      - name: Coverage summary
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run integration tests (testcontainers)
        run: make test-integration

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gosec
        # Fails the job, and so the publish, on high-severity, high-confidence findings.
        # Built with the job's Go rather than through securego/gosec's action, whose image ships
        # an older Go with GOTOOLCHAIN=local and refuses this module. gosec v2.29.0 requires
        # golang.org/x/tools v0.49.0, which cannot read the export data of Go 1.27.2 and later
        # (securego/gosec#1774), so x/tools is raised until a gosec release includes the fix.
        # The text report goes to the log too: a SARIF file alone hides package load errors.
        run: |
          tooldir="$RUNNER_TEMP/gosec-tool"
          mkdir -p "$tooldir"
          go -C "$tooldir" mod init gosec-tool
          go -C "$tooldir" get "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" golang.org/x/tools@v0.52.0
          go -C "$tooldir" build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
          "$RUNNER_TEMP/gosec" -severity high -confidence high -fmt sarif -out gosec.sarif -stdout -verbose text ./...

      - name: Upload gosec results
        # Runs after a failed scan too, so the Security tab shows what blocked the job.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec
        continue-on-error: true

      - name: govulncheck
        # Advisory: a CVE published upstream must not block unrelated changes.
        # The step log and the Security tab show what needs a dependency bump.
        continue-on-error: true
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, integration]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make build

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: team-task-nexus:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        # Fails the job, and so the publish, on CRITICAL or HIGH findings that have a fix.
        # Without limit-severities-for-sarif the action drops the severity filter for SARIF
        # output, and the exit code would then count findings of every severity.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: team-task-nexus:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results
        # Runs after a failed scan too, so the Security tab shows what blocked the job.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
        continue-on-error: true

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
