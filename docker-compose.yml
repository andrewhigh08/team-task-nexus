services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: ttn_api
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      LOG_FORMAT: json
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: apppassword
      DB_NAME: team_task_nexus
      REDIS_ADDR: redis:6379
      # Local development only; any real deployment supplies its own secret.
      JWT_SECRET: local-development-secret-change-me-0123456789
      NOTIFY_WEBHOOK_URL: ""
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: ttn_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: team_task_nexus
      MYSQL_USER: app
      MYSQL_PASSWORD: apppassword
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP rather than the socket: the entrypoint's temporary init server listens only on the socket,
      # so this check passes once the real server, with the app user created, accepts connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papppassword"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: ttn_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.7.0
    container_name: ttn_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
